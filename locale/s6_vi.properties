tools/characters_editor/join_check = Gia nhập đội khi nói chuyện
tools/characters_editor/join_tip = Đồng hành: sau khi gia nhập, nhân vật đi theo sau người hùng. Ghi hoặc xoá ngay kịch bản gia nhập của mod này.
tools/characters_editor/join_hint = Đặt nhân vật này lên bản đồ từ thẻ Nhân vật của trình soạn bản đồ RPG. Nói chuyện với nhân vật ở đó sẽ khiến nhân vật gia nhập đội; nhân vật đã đặt sẽ rời bản đồ và đi cùng người hùng. Thủ lĩnh không bao giờ gia nhập.
tools/characters_editor/join_on = Gia nhập đội: đã ghi kịch bản gia nhập của {0} vào mod này.
tools/characters_editor/join_off = Gia nhập đội: đã xoá kịch bản gia nhập của {0}.
