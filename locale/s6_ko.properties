tools/characters_editor/join_check = 말을 걸면 일행에 합류
tools/characters_editor/join_tip = 동료: 합류하면 캐릭터가 주인공 뒤를 따라 걷습니다. 이 모드의 합류 시나리오를 즉시 쓰거나 삭제합니다.
tools/characters_editor/join_hint = RPG 맵 편집기의 '캐릭터' 탭에서 이 캐릭터를 맵에 배치하세요. 거기서 말을 걸면 일행에 합류하고, 배치된 캐릭터는 맵에서 빠져 주인공과 함께 걷습니다. 리더는 합류하지 않습니다.
tools/characters_editor/join_on = 일행 합류: {0}의 합류 시나리오를 이 모드에 썼습니다.
tools/characters_editor/join_off = 일행 합류: {0}의 합류 시나리오를 삭제했습니다.
