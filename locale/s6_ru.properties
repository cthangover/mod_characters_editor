tools/characters_editor/join_check = Присоединяется к отряду при разговоре
tools/characters_editor/join_tip = Спутник: после присоединения персонаж идёт за героем. Сразу записывает или удаляет сценарий присоединения этого мода.
tools/characters_editor/join_hint = Поставьте персонажа на карту во вкладке «Персонажи» редактора карт RPG. Разговор с ним там присоединяет его к отряду; поставленный персонаж уходит с карты и идёт за героем. Лидер никогда не присоединяется.
tools/characters_editor/join_on = Присоединение к отряду: сценарий присоединения {0} записан в этот мод.
tools/characters_editor/join_off = Присоединение к отряду: сценарий присоединения {0} удалён.
