mod_characters_editor_name = Editor de personajes
mod_characters_editor_desc = Edita los personajes de un mod con el juego en marcha: nombres en todos los idiomas, retrato, sprite de paseo para el mapa RPG, cifras de combate y acciones. Un guardado llega al juego en marcha al instante.
