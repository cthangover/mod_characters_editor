tools/characters_editor/image = Chân dung
tools/characters_editor/image_tip = Hình trong thư mục characters/ của mod: hội thoại, trận đấu và bảng nhân vật hiển thị nó
tools/characters_editor/charset = Charset (RPG)
tools/characters_editor/charset_tip = Nhân vật trông thế nào trên bản đồ RPG: tấm 3×4 khung hình trong thư mục charsets/. Tiểu thuyết không cần
tools/characters_editor/level = Cấp độ
