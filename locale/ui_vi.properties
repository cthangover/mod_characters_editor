mod_characters_editor_name = Trình sửa nhân vật
mod_characters_editor_desc = Sửa các nhân vật của mod khi game đang chạy: tên bằng mọi ngôn ngữ, chân dung, sprite đi bộ cho bản đồ RPG, chỉ số và hành động chiến đấu. Mỗi lần lưu lập tức tới với game đang chạy.
tools/characters_editor/title = Nhân vật
