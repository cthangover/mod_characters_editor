tools/characters_editor/recruitment = Tỉ lệ chiêu mộ
tools/characters_editor/recruitment_tip = Tỉ lệ (phần trăm) nhận nhân vật bị đánh bại vào tổ đội; 0 — không bao giờ
tools/characters_editor/behaviour = Hành vi
