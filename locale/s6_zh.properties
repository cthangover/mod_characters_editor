tools/characters_editor/join_check = 对话时加入队伍
tools/characters_editor/join_tip = 同伴：加入后，角色会跟在主角身后行走。立即写入或删除本模组的加入剧本。
tools/characters_editor/join_hint = 在RPG地图编辑器的“角色”页签中把该角色放到地图上。在那里与其对话即可加入队伍；放置的角色随后离开地图，跟随主角行走。队长永远不会加入。
tools/characters_editor/join_on = 加入队伍：已在本模组中写入 {0} 的加入剧本。
tools/characters_editor/join_off = 加入队伍：已删除 {0} 的加入剧本。
